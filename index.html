<head>
    <meta charset="UTF-8">

    <title>System Diagnostics</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #00ff41; /* Terminal Green */
            --error-color: #ff3333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 800px;
            white-space: pre-wrap; /* Preserves formatting of the emergency text */
            word-wrap: break-word;
        }

        h1 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-size: 1.2rem;
            color: #888;
            width: 100%;
            margin-top: 0;
        }

        #status {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .success { color: var(--accent-color); }
        .error { color: var(--error-color); }
        .loading { color: #888; }

        /* Generator / Admin Styles */
        #generator {
            margin-top: 50px;
            border-top: 2px dashed #333;
            padding-top: 20px;
            width: 100%;
            display: none; /* Hidden unless needed */
        }

        .show-generator { display: block !important; }

        textarea, input {
            background: #222;
            border: 1px solid #444;
            color: white;
            width: 100%;
            font-family: inherit;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover { background: #444; }

        code {
            display: block;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 10px;
            overflow-x: auto;
            color: var(--accent-color);
            font-size: 0.8rem;
        }

        .hidden { display: none; }
    </style>
</head>
